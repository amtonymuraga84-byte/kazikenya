name: Update jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests feedparser anthropic
      - run: python job_aggregator.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
      - run: python build_site.py
      - name: Post new jobs to Telegram
        continue-on-error: true
        run: python telegram_post.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Commit changes
        run: |
          git config user.name "kazike-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Update jobs"
          for i in 1 2 3; do
            git fetch origin main
            if git rebase -X theirs origin/main; then
              git push && exit 0
            else
              git rebase --abort || true
            fi
            sleep 5
          done
          echo "Could not push after 3 tries"
          exit 1
