name: Update jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests feedparser anthropic
      - run: python job_aggregator.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
      - name: Commit changes
        run: |
          git config user.name "kazike-bot"
          git config user.email "bot@users.noreply.github.com"
          git add jobs.json seen.json
          git diff --cached --quiet || git commit -m "Update jobs"
          git push
